<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>מחשבון יד</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one phone screen, one row of buttons per question in tap order, verdict pinned to the bottom */
:root{
  --felt:#000; --felt-2:#0b0b0b; --line:#1c1c1c; --chalk:#8a8a8a; --muted:#4a4a4a;
  --gold:#a8873a; --call:#3d8a5c; --warn:#9c6a30; --fold:#9a413b;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--felt);color:var(--chalk);font-family:var(--font);font-size:15px;margin:0;
  padding-inline:16px;padding-block:12px 160px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em;margin-bottom:6px;display:flex;gap:6px;align-items:baseline}
.lbl i{font-style:normal;color:var(--gold);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:6px}
.seg button{min-width:0;background:var(--felt-2);color:var(--chalk);border:1px solid var(--line);border-radius:8px;
  font:500 14.5px/1.2 var(--font);padding:10px 4px;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button small{font-size:11px;color:var(--muted);direction:ltr;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--line);color:#c4c4c4;border-color:#3a3a3a}
.seg button[aria-pressed="true"] small{color:var(--chalk)}
.seg button:disabled{opacity:.3}
.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.verdict{position:fixed;inset-inline:0;bottom:0;background:var(--felt-2);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.verdict .in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:14px}
.word{font:700 28px var(--font);min-width:100px;text-align:center;padding:6px 10px;color:var(--muted)}
.word.raise{color:var(--gold)} .word.call{color:var(--call)} .word.warn{color:var(--warn)} .word.fold{color:var(--fold)}
.stats{display:flex;flex-direction:column;gap:4px;min-width:0}
.stats b{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
.why{font-size:13px;color:var(--chalk);line-height:1.4}
.seg button,.verdict{transition:none}
.sub{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap" dir="rtl">
  <section>
    <div class="seg" data-k="street">
      <button data-v="pre">פרה-פלופ</button><button data-v="flop">פלופ</button><button data-v="turn">טרן</button><button data-v="river">ריבר</button>
    </div>
  </section>

  <div id="pre" class="wrap">
    <section>
      <div class="lbl"><i>1</i>היד שלך</div>
      <div class="seg" data-k="hand" style="--cols:4">
        <button data-v="p1">פרימיום<small>AA–QQ, AK</small></button>
        <button data-v="p2">חזקה<small>JJ–TT, AQ</small></button>
        <button data-v="p3">זוג בינוני<small>99–77</small></button>
        <button data-v="p4">זוג קטן<small>66–22</small></button>
        <button data-v="p5">תמונות גבוהות<small>AJ, AT, KQ</small></button>
        <button data-v="p6">תמונות חלשות<small>KJ, QJ, KT, JT</small></button>
        <button data-v="p7">מחוברים בצבע<small>87s, A5s</small></button>
        <button data-v="p8">כל השאר<small>K7, Q4, 92…</small></button>
      </div>
    </section>
    <section>
      <div class="lbl"><i>2</i>העמדה שלך</div>
      <div class="seg" data-k="pos">
        <button data-v="0">מוקדמת<small>1–3</small></button><button data-v="1">אמצע<small>4–6</small></button>
        <button data-v="2">מאוחרת<small>7–8, כפתור</small></button><button data-v="3">ביג בליינד</button>
      </div>
    </section>
    <section>
      <div class="lbl"><i>3</i>מה קרה לפניך</div>
      <div class="seg" data-k="sit" style="--cols:3">
        <button data-v="open">אף אחד לא נכנס</button><button data-v="limp">נכנסו בלי העלאה</button>
        <button data-v="raise">העלאה אחת</button><button data-v="raisecall">העלאה + השוו</button>
        <button data-v="3bet">העלאה חוזרת / אול-אין</button>
      </div>
    </section>
  </div>

  <div id="post" class="wrap" hidden>
    <section>
      <div class="lbl"><i>1</i>מה יש לך עכשיו</div>
      <div class="seg" data-k="made" style="--cols:4">
        <button data-v="monster">מפלצת<small>סט, סטרייט, צבע</small></button>
        <button data-v="strong">שני זוגות<small>או אוברפייר</small></button>
        <button data-v="top">זוג עליון</button>
        <button data-v="weak">זוג חלש<small>אמצעי / תחתון</small></button>
        <button data-v="pairdraw" class="draw">זוג + דרו</button>
        <button data-v="bigdraw" class="draw">דרו חזק<small>צבע / סטרייט פתוח</small></button>
        <button data-v="smalldraw" class="draw">דרו חלש<small>סטרייט מבפנים</small></button>
        <button data-v="air">כלום</button>
      </div>
    </section>
    <section>
      <div class="lbl"><i>2</i>כמה הימרו מולך</div>
      <div class="seg" data-k="bet" style="--cols:5">
        <button data-v="0">צ׳ק</button><button data-v=".33">קטן<small>⅓ קופה</small></button>
        <button data-v=".5">חצי<small>½ קופה</small></button><button data-v="1">קופה</button>
        <button data-v="2">אול-אין<small>2× קופה</small></button>
      </div>
    </section>
    <section>
      <div class="lbl"><i>3</i>כמה יריבים ביד</div>
      <div class="seg" data-k="opp" style="--cols:3">
        <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3+</button>
      </div>
    </section>
  </div>
</div>

<div class="verdict" dir="rtl">
  <div class="in">
    <div class="word" id="word">…</div>
    <div class="stats">
      <div class="why" id="why"></div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
</div>

<script>
const S={street:'pre',hand:'p5',pos:'1',sit:'raisecall',made:'top',bet:'.5',opp:'1'};
const $=id=>document.getElementById(id);

/* ---------- preflop: action per hand group / situation, one letter per position (early, mid, late, BB) ---------- */
// R raise · C call · B borderline · F fold
const CHART={
  p1:{open:'RRRR',limp:'RRRR',raise:'RRRR',raisecall:'RRRR','3bet':'RRRR'},
  p2:{open:'RRRR',limp:'RRRR',raise:'CCRC',raisecall:'CCCC','3bet':'BBBB'},
  p3:{open:'RRRR',limp:'CCRC',raise:'CCCC',raisecall:'CCCC','3bet':'FFFF'},
  p4:{open:'BRRR',limp:'CCCC',raise:'BBCC',raisecall:'CCCC','3bet':'FFFF'},
  p5:{open:'RRRR',limp:'RRRR',raise:'FBCB',raisecall:'BBCB','3bet':'FFFF'},
  p6:{open:'FBRR',limp:'BCRC',raise:'FFBF',raisecall:'FBBB','3bet':'FFFF'},
  p7:{open:'FBRR',limp:'CCCC',raise:'FFBB',raisecall:'BCCC','3bet':'FFFF'},
  p8:{open:'FFFF',limp:'FFFF',raise:'FFFF',raisecall:'FFFF','3bet':'FFFF'},
};
const SIZE={open:'העלה לפי 3 מהביג בליינד',limp:'העלה לפי 3 מהביג בליינד + אחד לכל מי שנכנס',
  raise:'העלה לפי 3 מההעלאה',raisecall:'העלה לפי 4 מההעלאה',  '3bet':'אול-אין או העלאה גדולה'};
const NOTE={
  p3:'משחק על שלישייה. אם לא נכנס בפלופ, שחרר מול הימור',
  p4:'משחק על שלישייה (פעם ב-8 בערך). שלם רק אם ההעלאה עד פי 5 מהביג בליינד',
  p5:'זהירות: מי שהעלה מחזיק הרבה פעמים את אותו קלף עם קיקר טוב יותר',
  p6:'יד שנשלטת בקלות. זוג עליון איתה הוא לא בהכרח היד הכי טובה',
  p7:'מרוויחה כשהרבה שחקנים ביד. בלי דרו חזק או יותר בפלופ, שחרר',
  p8:'יד שמפסידה כסף לאורך זמן',
};
function preflop(){
  const a=CHART[S.hand][S.sit][+S.pos],bb=S.pos==='3';
  if(bb&&(S.sit==='open'||S.sit==='limp')&&a!=='R')return['צ׳ק','call','אתה בביג בליינד, תראה פלופ בחינם',''];
  if(a==='R')return['העלאה','raise',SIZE[S.sit],S.hand==='p1'&&S.sit==='3bet'?'עם QQ או AK מול שחקן הדוק אפשר גם רק לשלם':''];
  if(a==='C')return['שלם','call',NOTE[S.hand]||'יד שאפשר לשחק בעמדה הזו',''];
  if(a==='B')return['גבולי','warn','שלם אם ההעלאה קטנה או שהמעלה פרוע, אחרת קפל',NOTE[S.hand]||''];
  return['קפל','fold',NOTE[S.hand]||'לא שווה את הכסף מהעמדה הזו',''];
}

/* ---------- postflop: equity estimate from hand type + outs vs pot odds ---------- */
const HAND={monster:[.92,0],strong:[.78,0],top:[.62,0],weak:[.38,0],pairdraw:[.40,9],bigdraw:[.10,9],smalldraw:[.08,4],air:[.08,0]};
const pct=x=>Math.round(x*100)+'%';
function postflop(){
  const n=+S.opp,b=+S.bet,river=S.street==='river';
  let [base,o]=HAND[S.made];if(river)o=0;
  if(S.made!=='monster')base*=1-.15*b; // a bigger bet means a stronger range against you
  const made=Math.pow(base,1+.6*(n-1));
  let dr=S.street==='flop'?1-((47-o)/47)*((46-o)/46):S.street==='turn'?o/46:0;
  dr*=Math.pow(.95,n-1);
  const eq=made+(1-made)*dr;
  const req=b/(1+2*b);
  const imp=o&&!river&&b<2?.04:0;
  const nums=b?`סיכוי לנצח <b>${pct(eq)}</b> · צריך <b>${pct(req)}</b>`:`סיכוי לנצח <b>${pct(eq)}</b>`;
  const drawTxt=o?` · ${o} קלפים משלימים, ${pct(dr)} שייכנס`:'';
  if(b===0){
    if(eq>=.55)return['הימור','raise','הימור של חצי עד שני שליש קופה',nums+drawTxt];
    if(o>=9&&n===1&&!river)return['הימור','raise','חצי-בלוף: אפשר לנצח עכשיו או להשלים את הדרו',nums+drawTxt];
    return['צ׳ק','call',eq>=.35?'יש לך משהו, אבל לא מספיק כדי להמר':'אין מה להמר',nums+drawTxt];
  }
  if((S.made==='monster'||S.made==='strong')&&eq>=req+.2)return['העלאה','raise','יד חזקה. העלה לפי 3 מההימור',nums];
  const m=eq-(req-imp);
  if(m>=.03)return['שלם','call',imp?'המחיר מוצדק כולל מה שתרוויח אם הדרו ייכנס':'הסיכוי שלך גבוה מהמחיר',nums+drawTxt];
  if(m>=-.03)return['גבולי','warn','קרוב מאוד. מול שחקן שמבלף הרבה שלם, מול שחקן הדוק קפל',nums+drawTxt];
  return['קפל','fold','המחיר גבוה מהסיכוי שלך',nums+drawTxt];
}

function decide(){
  const r=S.street==='pre'?preflop():postflop();
  const el=$('word');el.textContent=r[0];el.className='word '+r[1];
  $('why').textContent=r[2];$('sub').innerHTML=r[3];
}

/* ---------- UI ---------- */
document.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn||btn.disabled)return;
  if(g.dataset.k==='street'&&S.street==='pre'&&btn.dataset.v!=='pre')S.bet='0';
  S[g.dataset.k]=btn.dataset.v;render()}));
function render(){
  document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-pressed',String(S[g.dataset.k]===b.dataset.v))));
  const river=S.street==='river';
  document.querySelectorAll('.draw').forEach(b=>b.disabled=river&&b.dataset.v!=='pairdraw');
  if(river&&(S.made==='bigdraw'||S.made==='smalldraw')){S.made='air';return render()}
  $('pre').hidden=S.street!=='pre';$('post').hidden=S.street==='pre';
  decide();
}
render();
</script>
</body>
</html>
